
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Registration | EMP</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            background: #cfddf1;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .register-card {
            width: 100%;
            max-width: 480px;
            border: none;
            border-radius: 14px;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="row justify-content-center">

            <div class="col-md-6 col-lg-5">

                <div class="card register-card shadow-sm">
                    <div class="card-body p-4">

                        <h2 class="text-center mb-2">
                            Create Account
                        </h2>

                        <p class="text-center text-muted mb-4">
                            Student Registration
                        </p>

                        <form method="POST"
                              action="{{ url_for('main.student_login_Successfull') }}">

                            <div class="mb-3">
                                <label for="username" class="form-label">
                                    Username
                                </label>

                                <input type="text"
                                       class="form-control"
                                       id="username"
                                       name="username"
                                       placeholder="Choose a username"
                                       required>
                            </div>

                            <div class="mb-3">
                                <label for="full_name" class="form-label">
                                    Full Name
                                </label>

                                <input type="text"
                                       class="form-control"
                                       id="full_name"
                                       name="full_name"
                                       placeholder="Enter your full name"
                                       required>
                            </div>

                            <div class="mb-3">
                                <label for="email" class="form-label">
                                    Email
                                </label>

                                <input type="email"
                                       class="form-control"
                                       id="email"
                                       name="email"
                                       placeholder="Enter your email"
                                       required>
                            </div>

                            <div class="mb-3">
                                <label for="password" class="form-label">
                                    Password
                                </label>

                                <input type="password"
                                       class="form-control"
                                       id="password"
                                       name="password"
                                       placeholder="Create a password"
                                       required>
                            </div>

                            <div class="mb-3">
                                <label for="confirm_password" class="form-label">
                                    Confirm Password
                                </label>

                                <input type="password"
                                       class="form-control"
                                       id="confirm_password"
                                       name="confirm_password"
                                       placeholder="Confirm your password"
                                       required>
                            </div>

                            <button type="submit"
                                    class="btn btn-dark w-100 mt-2">
                                Register
                            </button>

                        </form>

                        <hr class="my-4">

                        <p class="text-center mb-0">
                            Already have an account?
                            <a href="{{ url_for('main.login') }}">
                                Login here
                            </a>
                        </p>

                    </div>
                </div>

            </div>
        </div>
    </div>

</body>
</html>
