
{% extends "base.html" %}

{% block title %}Student Registration | Examination Management Portal{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">

        <div class="card shadow-sm border-0 mt-4">
            <div class="card-body p-4">

                <h2 class="text-center mb-2">Create Account</h2>
                <p class="text-center text-muted mb-4">
                    Student Registration
                </p>

                <form method="POST" action="{{ url_for('main.register') }}">

                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input
                            type="text"
                            class="form-control"
                            id="username"
                            name="username"
                            placeholder="Choose a username"
                            required
                        >
                    </div>
                      <label for="username" class="form-label">Full-Name</label>
                        <input
                            type="text"
                            class="form-control"
                            id="username"
                            name="username"
                            placeholder="Choose a username"
                            required
                        >

                    <div>
                        
                    <div class="mb-3">
                        <label class="form-label"></label>

                            <div class="role-switch">
                                <input type="radio" name="role" id="student"
                                    value="student" checked>

                                <input type="radio" name="role" id="examiner"
                                value="examiner">

                                    <div class="switch-slider"></div>

                                <label for="student">Student</label>
                                <label for="examiner">Examiner</label>
                            </div>
                    </div>

                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input
                            type="email"
                            class="form-control"
                            id="email"
                            name="email"
                            placeholder="Enter your email"
                            required
                        >
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input
                            type="password"
                            class="form-control"
                            id="password"
                            name="password"
                            placeholder="Create a password"
                            required
                        >
                    </div>

                    <div class="mb-3">
                        <label for="confirm_password" class="form-label">
                            Confirm Password
                        </label>
                        <input
                            type="password"
                            class="form-control"
                            id="confirm_password"
                            name="confirm_password"
                            placeholder="Confirm your password"
                            required
                        >
                    </div>

                    <button type="submit" class="btn btn-dark w-100 mt-2">
                        Register
                    </button>

                </form>

                <hr class="my-4">

                <p class="text-center mb-0">
                    Already have an account?
                    <a href="{{ url_for('main.login') }}">Login here</a>
                </p>

            </div>
        </div>

    </div>
</div>

{% endblock %}
